<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kho Zalo</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Gắn class .dark TRƯỚC khi React render: để cho useEffect thì trang vẽ một
      khung sáng rồi mới tối lại, mắt thấy rõ cú nháy trắng mỗi lần tải.
      Khóa localStorage phải khớp `KEY` trong src/shared/use-theme.ts.
    -->
    <script>
      (function () {
        try {
          var luu = localStorage.getItem("zalo-archive-theme");
          var toi = luu ? luu === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (toi) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage bị chặn (chế độ riêng tư): cứ để giao diện sáng */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
